version: "3.8"

services:
  logscope:
    build: .
    container_name: logscope-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 生产务必修改
      LOGSCOPE_AUTH_TOKEN: ${LOGSCOPE_AUTH_TOKEN:-your-secret-admin-token}
      # 默认指向同 compose 里的 ES；如果你有外部 ES，直接改成 http(s)://xxx:9200
      ES_HOSTS: ${ES_HOSTS:-http://elasticsearch:9200}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

